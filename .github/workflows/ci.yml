name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      brand:
        description: 'White-label brand directory, e.g. dsh-plugin-desktop/branding/acme (empty: WorkDSH)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Build-time white-label brand; tags and pushes always build WorkDSH.
  WORKDSH_BRAND: ${{ github.event_name == 'workflow_dispatch' && inputs.brand || '' }}
  # Tag builds install the published WorkDSH Profile from this repository's
  # v<version> release, so a fork releases its own Profile.
  WORKDSH_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
      desktop: ${{ steps.scope.outputs.desktop }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          # GitHub's pull-request merge ref can retain the base branch's
          # submodule gitlink when the PR advances it to a descendant. Check
          # out the actual PR head so pinned submodules match upstream.json.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            product=true
            desktop=true
            web=false
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
            desktop=true
            web=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
            changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if [[ -n "$changed_paths" ]] && grep -q '^workdsh-web/' <<< "$changed_paths"; then web=true; else web=false; fi
            if [[ -n "$changed_paths" ]] && grep -qv '^workdsh-web/' <<< "$changed_paths"; then desktop=true; else desktop=false; fi
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # Full product gate: build, typecheck, unit tests, and every headless smoke.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - if: needs.changes.outputs.product == 'true'
        run: yarn install --immutable
      - if: needs.changes.outputs.product == 'true'
        run: yarn check

  web-source-check:
    name: Web source checks (no installer)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - working-directory: workdsh-web
        run: pnpm install --frozen-lockfile
      - working-directory: workdsh-web
        run: pnpm build
      - working-directory: workdsh-web
        run: pnpm typecheck
      - working-directory: workdsh-web
        run: pnpm check:versions
      - name: Install browser for Web integration tests
        working-directory: workdsh-web
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: workdsh-web
        run: pnpm test:integration

  # Windows-only logic and unsigned NSIS build on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once before packaging.
  # SenseVoiceSmall INT4 weights for every installer, made once from the FP32
  # export DSH pins (scripts/prepare-workdsh-speech.ts) and cached per recipe.
  speech-model:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: dsh-plugin-desktop/build/.workdsh-speech-cache
          key: sensevoice-int4-${{ hashFiles('dsh-plugin-desktop/scripts/prepare-workdsh-speech.ts', 'dsh-plugin-desktop/scripts/sensevoice/*') }}
      - name: Make or reuse the SenseVoice INT4 weights
        env:
          WORKDSH_PYTHON: python
        run: node dsh-plugin-desktop/scripts/prepare-workdsh-speech.ts --cache-only
      - name: Hand the weights to the packaging jobs
        uses: actions/upload-artifact@v4
        with:
          name: workdsh-speech-cache
          path: dsh-plugin-desktop/build/.workdsh-speech-cache
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  desktop-windows:
    needs: [changes, speech-model]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      # The SenseVoice INT4 weights this run made once; see the speech-model job.
      - name: Fetch the bundled SenseVoice weights
        uses: actions/download-artifact@v5
        with:
          name: workdsh-speech-cache
          path: dsh-plugin-desktop/build/.workdsh-speech-cache
      - name: Package Windows through the single release script
        timeout-minutes: 90
        run: node scripts/package-desktop-release.mjs --source=${{ github.ref_type == 'tag' && 'published' || 'local' }}
      - name: Report unpacked Windows footprint
        run: node dsh-plugin-desktop/scripts/report-package-footprint.mjs dsh-plugin-desktop/dist/win-unpacked dsh-plugin-desktop/dist/windows-footprint.json
      - name: Upload Windows footprint report
        uses: actions/upload-artifact@v4
        with:
          name: desktop-footprint-windows-x64
          path: dsh-plugin-desktop/dist/windows-footprint.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-desktop-windows-x64
          path: |
            dsh-plugin-desktop/dist/*.exe
            dsh-plugin-desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows 7 compatibility audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows7-audit
          path: dsh-plugin-desktop/dist/windows7-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows 7 x64 offline installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-desktop-windows7-x64
          path: dsh-plugin-desktop/dist/win7/*.exe
          if-no-files-found: error
          retention-days: 14

  # Per-architecture macOS packaging on native macOS 15 runners: the Profile's
  # per-CPU packages follow the host, so Intel is built on Intel. The job then
  # runs the DMG's runtimes on the oldest supported macOS. The signed release
  # is built manually on a credentialed machine; no signing secrets reach this job.
  desktop-macos:
    needs: [changes, speech-model]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      # The SenseVoice INT4 weights this run made once; see the speech-model job.
      - name: Fetch the bundled SenseVoice weights
        uses: actions/download-artifact@v5
        with:
          name: workdsh-speech-cache
          path: dsh-plugin-desktop/build/.workdsh-speech-cache
      # Spotlight indexes each freshly built disk image, which can keep it busy
      # so that dmgbuild's hdiutil detach fails with "Resource busy".
      - name: Stop Spotlight indexing on the runner
        run: sudo mdutil -a -i off
      - name: Package macOS through the single release script
        timeout-minutes: 55
        env:
          WORKDSH_MAC_ARCH: ${{ matrix.arch }}
        run: node scripts/package-desktop-release.mjs --source=${{ github.ref_type == 'tag' && 'published' || 'local' }}
      - name: Run the DMG on macOS 15
        timeout-minutes: 15
        run: bash dsh-plugin-desktop/scripts/smoke-macos-dmg.sh dsh-plugin-desktop/dist/mac-smoke/${{ matrix.arch }}/*.dmg ${{ matrix.arch }}
      - name: Upload macOS compatibility audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}-audit
          path: dsh-plugin-desktop/dist/mac-smoke/${{ matrix.arch }}/macos-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload macOS architecture DMG
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-desktop-macos-${{ matrix.arch }}
          path: |
            dsh-plugin-desktop/dist/mac-smoke/${{ matrix.arch }}/*.dmg
            dsh-plugin-desktop/dist/mac-smoke/${{ matrix.arch }}/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 14

  # Ubuntu packages, built natively per architecture and then installed into
  # clean Ubuntu 20.04 (the oldest supported release) and 24.04 containers. The
  # package script's ELF audit already rejects symbols newer than glibc 2.31.
  desktop-linux:
    needs: [changes, speech-model]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      # The SenseVoice INT4 weights this run made once; see the speech-model job.
      - name: Fetch the bundled SenseVoice weights
        uses: actions/download-artifact@v5
        with:
          name: workdsh-speech-cache
          path: dsh-plugin-desktop/build/.workdsh-speech-cache
      # The llama.cpp server is built from source in ubuntu:20.04 (the official
      # Ubuntu builds need glibc 2.34); the cache holds it per pinned input.
      - uses: actions/cache@v6
        with:
          path: dsh-plugin-desktop/build/.workdsh-llama-cache
          key: llama-linux-${{ matrix.arch }}-${{ hashFiles('dsh-plugin-desktop/scripts/build-llama-linux.sh', 'dsh-plugin-desktop/scripts/prepare-workdsh-llama.ts') }}
      - name: Package Ubuntu through the single release script
        timeout-minutes: 70
        run: node scripts/package-desktop-release.mjs --source=${{ github.ref_type == 'tag' && 'published' || 'local' }}
      - name: Install and run the package on Ubuntu 20.04 and 24.04
        timeout-minutes: 30
        run: |
          # 24.04 exercises the t64 alternatives in the package's dependencies.
          for image in ubuntu:20.04 ubuntu:24.04; do
            docker run --rm -v "$PWD/dsh-plugin-desktop:/work:ro" "$image" \
              bash -c 'bash /work/scripts/smoke-ubuntu-deb.sh /work/dist/*-linux-*.deb'
          done
      - name: Upload Ubuntu compatibility audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}-audit
          path: dsh-plugin-desktop/dist/linux-${{ matrix.arch }}-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-desktop-linux-${{ matrix.arch }}
          path: dsh-plugin-desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # Upstream toolchain smoke: the portable-shell scripts must resolve the
  # pinned submodule's own Yarn/pnpm release on Windows.
  # The corresponding source of the bundled GPLv3 FFmpeg, assembled from the
  # upstream locations pinned in prepare-workdsh-media.ts. The artifact name
  # makes the Desktop release attach it next to the installers.
  ffmpeg-sources:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Assemble the FFmpeg corresponding source
        run: node dsh-plugin-desktop/scripts/pack-ffmpeg-sources.ts ffmpeg-sources/ffmpeg-8.1.2-corresponding-source.tar.gz
      - name: Upload the FFmpeg corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-desktop-ffmpeg-sources
          path: ffmpeg-sources/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn check:layout
      - run: yarn upstream:version

  publish-desktop-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
    needs: [check, desktop-windows, desktop-macos, desktop-linux, upstream-command-windows, ffmpeg-sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - name: Require one DSH version before publication
        run: node scripts/verify-desktop-dsh-alignment.mjs
      - name: Require release tag to match Desktop package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const version = require('./dsh-plugin-desktop/package.json').version; if (process.env.TAG !== 'desktop-v' + version) { throw new Error('Release tag does not match Desktop package version: ' + process.env.TAG + ' != desktop-v' + version) }"
      - name: Download desktop packages
        uses: actions/download-artifact@v5
        with:
          pattern: dsh-plugin-desktop-*
          path: staging
      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r -d '' file; do
            artifact="$(basename "$(dirname "$file")")"
            name="$(basename "$file")"
            cp "$file" "release-assets/${artifact}--${name}"
          done < <(find staging -type f -print0)
          (cd release-assets && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG#desktop-v}"
          cat > release-notes.md <<'EOF'
          WorkDSH Desktop 将 WorkBuddy 风格的项目、资料、专家、技能和连接器工作台与 DeepSeek Harness 插件能力结合。

          - 技能页接入 SkillHub 目录，可查看技能图标、来源、版本与安装入口；本地技能仍可单独管理。
          - 现有插件页可直接发现 DSH 社区插件，并打开第三方 dsh-market 目录进行搜索和安装。
          - Desktop 使用锁定的官方 DSH 0.2.0-rc.1 Profile；内置 Node.js 和 Python，不额外打包浏览器。
          - 内置 FFmpeg 8.1.2 与 FFprobe（GPLv3，作为独立程序运行）：可在对话中转换、压缩、无损剪辑、合并音视频并提取音频；对应源码见安装目录 media/SOURCES.md 与本版本附带的源码归档。
          - 内置 llama.cpp（b11247）本地模型服务：首次启动时可选择“启动本地模型”或填写 API Key，也可在“设置 → 模型”中随时开关。把 GGUF 模型文件放进用户数据目录下的 models 文件夹，几秒后即可在模型列表中选择“本地模型 (llama.cpp)”，无需联网或 API 密钥。服务仅监听本机回环地址，并使用每次启动随机生成的密钥。Windows 版可用 Vulkan 调用显卡，macOS Apple Silicon 使用 Metal。
          - 内置 SenseVoiceSmall INT4 语音识别模型（约 155 MB，比 DSH 默认下载的 INT8 小约三分之一）与 Silero 语音检测模型：在“插件”中开启语音输入即可离线识别，无需下载模型。
          - 白牌构建的名称与标志同时用于侧栏和对话首页；默认模型、模型路由、已开启的插件（如语音输入）等设置在重启和升级后保留。
          - 提供 Windows x64 安装包，以及 macOS Intel x64、Apple Silicon arm64 未签名 DMG（macOS 15 及以上，分别在对应架构的 macOS 15 上构建并验证）。
          - 提供 Ubuntu 20.04 及以上 x64（amd64）与 arm64 的 .deb 安装包，内置 Node.js、Python 与办公技能，并在 Ubuntu 20.04 与 24.04 中安装验证。
          - 提供 Windows 7 SP1 x64 全量离线安装包：内置 VxKex NEXT 1.2.3.2463 与 Microsoft VC++ 运行库，缺失时自动安装；Windows 7 支持为尽力支持。

          SkillHub 和 dsh-market 是独立第三方来源；目录内容并非全部预装或经 WorkDSH 审核。安装前请检查许可、依赖和版本兼容性。本次为 Alpha 预发布，升级前请备份本地配置和数据。所有文件的 SHA-256 见 `SHA256SUMS`。
          EOF
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WorkDSH Desktop ${VERSION}" \
            --notes-file release-notes.md \
            --latest
