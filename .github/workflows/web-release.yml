name: Web release

# Publishes the WorkDSH Web and plugin Profile (v<version>) that Desktop tag
# builds install. Push the v<version> tag on the default branch before the
# matching desktop-v<version> tag, or run the Release workflow, which creates
# both tags and dispatches this workflow on the first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  publish-web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - name: Require the tag to match the Web package version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const version = require('./workdsh-web/package.json').version; if (process.env.TAG !== 'v' + version) throw new Error('Tag ' + process.env.TAG + ' does not match Web version v' + version)"
      - name: Check Web DSH alignment
        run: node scripts/verify-web-desktop-dsh-alignment.mjs
      - name: Install Web dependencies
        working-directory: workdsh-web
        run: corepack pnpm install --frozen-lockfile
      - name: Build Web and plugins
        working-directory: workdsh-web
        run: corepack pnpm build
      - name: Pack the Profile release
        working-directory: workdsh-web
        run: corepack pnpm release:project:pack
      - name: Require a clean package of the tagged commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The build must not change tracked Web sources or the DSH inputs.
          git diff --exit-code HEAD -- workdsh-web upstream.json
          node -e "
          const manifest = require('./workdsh-web/.artifacts/project-' + process.env.TAG + '/release-manifest.json');
          if (manifest.tag !== process.env.TAG || manifest.sourceCommit !== process.env.GITHUB_SHA || manifest.sourceDirty) {
            throw new Error('Release manifest is not a clean package of ' + process.env.GITHUB_SHA + ': ' + JSON.stringify({ tag: manifest.tag, sourceCommit: manifest.sourceCommit, sourceDirty: manifest.sourceDirty }));
          }"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" workdsh-web/.artifacts/project-"$TAG"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WorkDSH Web and plugins ${TAG#v}" \
            --notes-file workdsh-web/RELEASE-NOTES.md \
            --prerelease
