- insert:
    - id: workdsh-installation-probe
      name: workdsh-bundle
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: !!js "!!process.env.DSH_ELECTRON_EXECUTABLE"
      config:
        mode: launch
        headless: true
        executablePath: !!js "process.env.DSH_BROWSER_EXECUTABLE ?? (process.platform === 'darwin' ? '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' : undefined)"
    - id: workdsh-browser-session
      name: workdsh-provider-browser-session
      disabled: !!js "!process.env.DSH_ELECTRON_EXECUTABLE"
      config:
        electronExecutable: !!js "process.env.DSH_ELECTRON_EXECUTABLE"
    # Desktop passes its bundled llama-server and the user's models folder; the
    # plugin starts the server when the user chooses local models, or once the
    # folder holds one. A Web deployment can name its own router's address.
    - id: workdsh-local-models
      name: workdsh-bundle/local-models
      disabled: !!js "!process.env.WORKDSH_LLAMA_BASE_URL && !process.env.WORKDSH_LLAMA_SERVER"
      config:
        baseURL: !!js "process.env.WORKDSH_LLAMA_BASE_URL"
        server: !!js "process.env.WORKDSH_LLAMA_SERVER"
        modelsDir: !!js "process.env.WORKDSH_LLAMA_MODELS_DIR"
        stateDir: !!js "process.env.WORKDSH_LLAMA_STATE_DIR"
        contextSize: !!js "Number(process.env.WORKDSH_LLAMA_CONTEXT_SIZE) || undefined"
    - id: auto-review
      name: '@deepseek-ai/dsh-experimental-auto-review'
- id: ui-sidebar-browser
  disabled: false
